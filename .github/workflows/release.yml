# Builds Duke Nutanix and publishes a GitHub Release with the web version (zip)
# and the desktop app for Windows (.msi, setup .exe), macOS (universal .dmg) and
# Linux (.AppImage, .deb, .rpm). Two ways to release version 1.2.3:
#   - push a tag: git tag v1.2.3 && git push origin v1.2.3
#   - or Actions > Release > Run workflow, with 1.2.3 as the version: the release
#     creates the v1.2.3 tag on the selected branch's last commit.
# Run by hand without a version, it only builds the files, as run artifacts.
#
# Auto-update needs three repository secrets (Settings > Secrets and variables > Actions),
# made with `npx @tauri-apps/cli@2 signer generate -w duke-nutanix.key`:
#   TAURI_SIGNING_PRIVATE_KEY           content of duke-nutanix.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   TAURI_UPDATER_PUBKEY                content of duke-nutanix.key.pub
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 1.2.3 (empty: test build, no release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  web:
    name: Web version
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the 50 levels
        run: node tools/validate-levels.js
      # version and release flag, from the pushed tag or the manual input
      - name: Release version
        id: meta
        shell: bash
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT#v}"; fi
          if [ -z "$v" ]; then echo "release=false" >> "$GITHUB_OUTPUT"; echo "version=" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.2.3, got '$v'"; exit 1; fi
          echo "release=true" >> "$GITHUB_OUTPUT"; echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Set the version
        if: steps.meta.outputs.release == 'true'
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2))" "${{ steps.meta.outputs.version }}"
      - name: Zip the game
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node tools/build-web.js
          name="duke-nutanix-${VERSION:-test}-web"
          mv dist "$name"
          zip -qr "$name.zip" "$name"
          echo "ZIP=$name.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v6
        with:
          name: web
          path: ${{ env.ZIP }}
      - name: Create the draft release
        id: release
        if: steps.meta.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Duke Nutanix v${{ steps.meta.outputs.version }}
          files: ${{ env.ZIP }}
          body: |
            ## Download

            | System | File |
            | --- | --- |
            | Windows 10/11 | `Duke.Nutanix_*_x64-setup.exe` (or the `.msi`) |
            | macOS 10.15+ (Intel and Apple silicon) | `Duke.Nutanix_*_universal.dmg` |
            | Linux | `.AppImage` (any distribution), `.deb` (Debian, Ubuntu), `.rpm` (Fedora) |
            | Any browser, no install | `duke-nutanix-*-web.zip`: unzip and open `index.html` |

            The apps are not signed with a paid certificate yet:
            - **Windows**: SmartScreen shows "Windows protected your PC": click **More info** then **Run anyway**.
            - **macOS**: if it says the app is damaged or cannot be checked, move it to Applications and run
              `xattr -cr "/Applications/Duke Nutanix.app"` in a Terminal, or right-click the app and choose **Open**.
            - **Linux**: make the AppImage executable (`chmod +x Duke*.AppImage`).

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
            targets: ''
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04   # older glibc: the AppImage runs on more distributions
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Set the version
        if: needs.web.outputs.release == 'true'
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2))" "${{ needs.web.outputs.version }}"
      # Auto-update: with the signing key in the repository secrets, the build also produces
      # signed update bundles and latest.json, and the app gets the public key to verify them.
      # Without the secrets the apps build normally, with no updates.
      - name: Enable the updater
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ "$HAS_KEY" != "true" ] || [ -z "$PUBKEY" ]; then echo "::warning::No updater key in the secrets: building without auto-update"; exit 0; fi
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=true;c.plugins.updater.pubkey=process.env.PUBKEY;fs.writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Build (and attach to the release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}
          releaseId: ${{ needs.web.outputs.release_id }}
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm

  publish:
    name: Publish the release
    needs: [web, desktop]
    if: needs.web.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.web.outputs.release_id }}" -F draft=false -f make_latest=true --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
