<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUKE NUTANIX: The admin is back</title>
  <meta name="description" content="Retro browser FPS in the spirit of Duke Nukem: 50 datacenter levels.">
  <link rel="icon" type="image/png" href="docs/icon.png">
  <style>
    /* bundled so the game also works offline and in the desktop app (SIL Open Font License, fonts/OFL.txt) */
    @font-face {
      font-family: "Press Start 2P"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("fonts/PressStart2P-Regular.ttf") format("truetype");
    }
    :root {
      --green: #3dff6a;
      --red: #ff4d2e;
      --bg: #050607;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); overflow: hidden;
      color: #d8dde3; font-family: "Press Start 2P", monospace;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #view { display: block; position: relative; z-index: 1; image-rendering: pixelated; background: #000; cursor: crosshair; }
    #gl { position: fixed; z-index: 0; pointer-events: none; display: none; background: #000; }
    #vignette {
      position: fixed; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.5) 100%);
    }
    #overlay {
      position: fixed; z-index: 10; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(0,20,8,0.72), rgba(0,0,0,0.92));
      padding: 16px; overflow-y: auto;
    }
    #overlay.hidden { display: none; }
    #panel {
      max-width: 720px; width: 100%; text-align: center; margin: auto;
      border: 2px solid #1f4f2a; background: rgba(4,10,6,0.85);
      padding: 28px 24px; box-shadow: 0 0 40px rgba(61,255,106,0.12), inset 0 0 60px rgba(0,0,0,0.6);
    }
    .logo {
      font-size: clamp(22px, 5.2vw, 50px); margin: 0 0 12px; color: var(--red); letter-spacing: 2px;
      text-shadow: 3px 3px 0 #5a0d00, 0 0 18px rgba(255,77,46,0.5);
    }
    .logo .ntnx { color: #f2f2f2; text-shadow: 3px 3px 0 #2a2140, 0 0 18px rgba(120,85,250,0.55); }
    .logo .x { color: #7855fa; }
    h1.dead { color: var(--red); font-size: clamp(18px, 4vw, 32px); text-shadow: 0 0 14px rgba(255,0,0,0.5); }
    h2 { color: var(--green); font-size: clamp(11px, 2.2vw, 16px); line-height: 1.6; margin: 0 0 18px; }
    .ok { color: #ffe14a; }
    .story { font-size: 10px; line-height: 2; color: #b8c2cc; margin: 0 auto 22px; max-width: 600px; }
    .story b { color: var(--green); }
    button {
      font: inherit; font-size: 10px; color: #d8dde3; background: #16201a; border: 2px solid #2e6b3a;
      padding: 10px 16px; margin: 6px; cursor: pointer; text-transform: uppercase;
    }
    button:hover, button:focus-visible { background: #2e6b3a; color: #fff; outline: none; }
    button.big { font-size: 13px; padding: 14px 24px; color: #fff; background: #7a1a0d; border-color: var(--red); }
    button.big:hover { background: var(--red); }
    table.ctl { margin: 22px auto 0; font-size: 8px; line-height: 1.9; border-collapse: collapse; text-align: left; }
    table.ctl td { padding: 2px 10px; }
    table.ctl td:first-child { color: #ffe14a; text-align: right; }
    table.stats { margin: 0 auto 22px; font-size: 12px; line-height: 2.2; }
    table.stats td { padding: 0 16px; }
    table.stats td:first-child { color: #9aa3ad; text-align: left; }
    table.stats td:last-child { color: var(--red); text-align: right; }
    h3 { color: #ffe14a; font-size: 9px; margin: 18px 0 8px; text-align: left; }
    .ep { color: #9aa3ad; font-size: 0.7em; }
    .story.small { font-size: 8px; color: #b6a4ff; }
    .story.objective { color: #20e8ff; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    .grid button.lvl { margin: 0; padding: 8px 0; font-size: 8px; }
    .grid button.lvl.boss { border-color: var(--red); color: #ffb0a0; }
    .grid button.lvl.mini { border-color: #ff9a1a; color: #ffd0a0; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    button:disabled:hover { background: #16201a; color: #d8dde3; }
    @media (max-width: 560px) { .grid { grid-template-columns: repeat(5, 1fr); } }
    .hint { font-size: 7px; color: #6b7178; margin-top: 18px; }
    .sens { display: block; font-size: 8px; margin-top: 16px; color: #9aa3ad; }
    .sens input { vertical-align: middle; margin-left: 8px; }
    noscript { color: #fff; }
    #update {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: calc(100% - 32px);
      font-size: 9px; line-height: 1.8; text-align: center; color: #d8dde3;
      background: rgba(20,14,40,0.95); border: 2px solid #7855fa; padding: 10px 16px;
      box-shadow: 0 0 24px rgba(120,85,250,0.35);
    }
    #update[hidden] { display: none; }
    #update b { color: #b6a4ff; }
    #update a { color: #3dff6a; margin: 0 8px; }
    #update button { font-size: 8px; padding: 6px 10px; margin: 0 0 0 10px; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="view" width="960" height="540"></canvas>
  <div id="vignette"></div>
  <div id="overlay"><div id="panel"><h2>LOADING DATACENTER...</h2></div><div id="update" hidden></div></div>
  <noscript>This game requires JavaScript.</noscript>
  <script src="js/version.js"></script>
  <script src="js/update.js"></script>
  <script src="js/levelgen.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/monsters3d.js"></script>
  <script src="js/lighting.js"></script>
  <script src="js/retro.js"></script>
  <script src="js/gl.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
